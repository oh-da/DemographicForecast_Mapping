<title>Northern Israel Density Atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Rubik:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --page:#f4f6f3; --surface:#fdfdfc; --card:#ffffff;
  --ink:#131614; --ink2:#59605c; --ink3:#8b928e;
  --hair:#e2e5e0; --line:#fdfdfc;
  --accent:#e8890c; --accent-ink:#9d5a00;
  --shadow:0 1px 2px rgba(19,22,20,.06),0 8px 28px rgba(19,22,20,.10);
  --rz:#e9e9e2;
  --r0:#cde2fb; --r1:#9ec5f4; --r2:#6da7ec; --r3:#3987e5; --r4:#256abf; --r5:#184f95; --r6:#0d366b;
  --sea:#e3ecf2;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#101211; --surface:#181a19; --card:#1e211f;
    --ink:#f0f2ef; --ink2:#a9b0ac; --ink3:#737a76;
    --hair:#2b2f2c; --line:#181a19;
    --accent:#f59d27; --accent-ink:#f5b45e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px rgba(0,0,0,.45);
    --rz:#242724;
    --r0:#0d366b; --r1:#104281; --r2:#1c5cab; --r3:#2a78d6; --r4:#5598e7; --r5:#86b6ef; --r6:#cde2fb;
    --sea:#131b20;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#101211; --surface:#181a19; --card:#1e211f;
  --ink:#f0f2ef; --ink2:#a9b0ac; --ink3:#737a76;
  --hair:#2b2f2c; --line:#181a19;
  --accent:#f59d27; --accent-ink:#f5b45e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px rgba(0,0,0,.45);
  --rz:#242724;
  --r0:#0d366b; --r1:#104281; --r2:#1c5cab; --r3:#2a78d6; --r4:#5598e7; --r5:#86b6ef; --r6:#cde2fb;
  --sea:#131b20;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--page); color:var(--ink);
  font:14px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button,input{font:inherit; color:inherit}

/* ---------- header ---------- */
header{
  flex:0 0 auto; display:flex; align-items:center; gap:24px; flex-wrap:wrap;
  padding:14px 22px 12px; border-bottom:1px solid var(--hair); background:var(--page);
}
.brand .eyebrow{
  font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent-ink); margin-bottom:2px;
}
.brand h1{
  margin:0; font-family:Archivo,Rubik,system-ui,sans-serif; font-weight:800;
  font-size:clamp(17px,2.2vw,23px); letter-spacing:-.015em; line-height:1.1; text-wrap:balance;
}
.stats{display:flex; gap:26px; margin-left:auto}
.stat .v{
  font-family:Archivo,Rubik,system-ui,sans-serif; font-weight:700; font-size:19px;
  letter-spacing:-.01em; font-variant-numeric:tabular-nums;
}
.stat .v small{font-size:12px; font-weight:600; color:var(--ink2); letter-spacing:0}
.stat .k{font-size:10.5px; font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3)}

/* ---------- stage ---------- */
#stage{position:relative; flex:1 1 auto; min-height:0; background:var(--surface); overflow:hidden; touch-action:none}
#map{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab}
#map.panning{cursor:grabbing}
.z{stroke:var(--line); stroke-width:.6; transition:opacity .18s}
.z.k0{fill:var(--r0)} .z.k1{fill:var(--r1)} .z.k2{fill:var(--r2)} .z.k3{fill:var(--r3)}
.z.k4{fill:var(--r4)} .z.k5{fill:var(--r5)} .z.k6{fill:var(--r6)} .z.kz{fill:var(--rz)}
.z:hover{stroke:var(--accent); stroke-width:2.25}
.z.sel{stroke:var(--accent); stroke-width:2.75}
#stage[data-hl] .z{opacity:.10}
#stage[data-hl="k0"] .z.k0,#stage[data-hl="k1"] .z.k1,#stage[data-hl="k2"] .z.k2,
#stage[data-hl="k3"] .z.k3,#stage[data-hl="k4"] .z.k4,#stage[data-hl="k5"] .z.k5,
#stage[data-hl="k6"] .z.k6,#stage[data-hl="kz"] .z.kz{opacity:1}
.city{pointer-events:none}
.city circle{fill:var(--ink); opacity:.65}
.city text{
  fill:var(--ink); font-family:Rubik,system-ui,sans-serif; font-weight:600; opacity:.78;
  paint-order:stroke; stroke:var(--surface); stroke-width:.22em; letter-spacing:.02em;
}

/* ---------- floating cards ---------- */
.card{
  position:absolute; background:var(--card); border:1px solid var(--hair);
  border-radius:10px; box-shadow:var(--shadow);
}
#controls{top:14px; left:14px; display:flex; flex-direction:column; padding:5px; gap:3px}
#controls button{
  width:32px; height:32px; border:0; border-radius:7px; background:transparent;
  font-size:17px; font-weight:500; cursor:pointer; display:grid; place-items:center; color:var(--ink2);
}
#controls button:hover{background:var(--page); color:var(--ink)}
#searchwrap{top:14px; left:58px; padding:5px}
#search{
  width:108px; border:0; background:transparent; outline:none; padding:6px 8px;
  font-variant-numeric:tabular-nums;
}
#search::placeholder{color:var(--ink3)}
#searchwrap.miss{outline:2px solid #d03b3b}

/* legend */
#legend{left:14px; bottom:14px; padding:13px 15px 11px; width:212px}
#legend h2{
  margin:0 0 9px; font-size:10.5px; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink2);
}
.lrow{
  display:flex; align-items:center; gap:9px; width:100%; padding:3px 5px; margin:0 -5px;
  border:0; background:none; border-radius:6px; cursor:pointer; text-align:left;
}
.lrow:hover,.lrow:focus-visible{background:var(--page)}
.lrow .sw{flex:0 0 auto; width:15px; height:15px; border-radius:4px; border:1px solid var(--hair)}
.lrow .rng{flex:1; font-size:12.5px; font-variant-numeric:tabular-nums}
.lrow .ct{font-size:11px; color:var(--ink3); font-variant-numeric:tabular-nums}
#legend .note{margin-top:8px; font-size:10.5px; color:var(--ink3); line-height:1.4}

/* detail panel */
#panel{top:14px; right:14px; width:252px; padding:15px 17px 14px; max-height:calc(100% - 60px); overflow:auto}
#panel h2{
  margin:0 0 2px; font-size:10.5px; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink2);
}
.trow{
  display:flex; align-items:baseline; gap:8px; width:100%; padding:4px 6px; margin:0 -6px;
  border:0; background:none; border-radius:6px; cursor:pointer; text-align:left;
  font-variant-numeric:tabular-nums;
}
.trow:hover,.trow:focus-visible{background:var(--page)}
.trow .rk{flex:0 0 17px; font-size:10.5px; color:var(--ink3)}
.trow .tz{flex:0 0 44px; font-weight:600; font-size:12.5px}
.trow .nf{flex:1; font-size:11.5px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.trow .dv{font-size:12px; font-weight:600}
#panel .note{margin-top:9px; font-size:10.5px; color:var(--ink3); line-height:1.4}
/* selected-zone state */
#panel .ztag{display:flex; align-items:center; gap:8px; margin:2px 0 1px}
#panel .ztag .num{font-family:Archivo,Rubik,sans-serif; font-weight:800; font-size:24px; letter-spacing:-.02em}
#panel .ztag .chip{
  margin-left:auto; display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--ink2);
  border:1px solid var(--hair); border-radius:99px; padding:3px 9px 3px 5px;
}
#panel .ztag .chip .sw{width:11px; height:11px; border-radius:3px}
#panel .where{font-size:12px; color:var(--ink2); margin-bottom:10px}
#panel .where bdi{font-weight:500; color:var(--ink)}
#panel .hero{
  font-family:Archivo,Rubik,sans-serif; font-weight:800; font-size:34px; line-height:1;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums;
}
#panel .hero small{font-size:13px; font-weight:600; color:var(--ink2); letter-spacing:0}
#panel .pct{font-size:11.5px; color:var(--ink2); margin:5px 0 12px}
#panel .kv{display:grid; grid-template-columns:1fr 1fr; gap:10px; border-top:1px solid var(--hair); padding-top:11px}
#panel .kv .v{font-weight:600; font-size:15px; font-variant-numeric:tabular-nums}
#panel .kv .k{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3)}
#panel .back{
  margin:12px -6px 0; padding:5px 6px; border:0; background:none; border-radius:6px;
  color:var(--accent-ink); font-size:12px; font-weight:500; cursor:pointer;
}
#panel .back:hover{background:var(--page)}

#tip{
  position:absolute; pointer-events:none; z-index:5; display:none; max-width:240px;
  background:var(--card); border:1px solid var(--hair); border-radius:9px; box-shadow:var(--shadow);
  padding:9px 12px;
}
#tip .t1{display:flex; align-items:baseline; gap:7px; margin-bottom:1px}
#tip .t1 b{font-size:13.5px}
#tip .t1 span{font-size:11px; color:var(--ink2)}
#tip .t2{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums}
#tip .t2 small{font-size:11px; font-weight:500; color:var(--ink2)}
#tip .t3{font-size:11px; color:var(--ink3); font-variant-numeric:tabular-nums}

#srcline{
  position:absolute; right:10px; bottom:8px; font-size:10px; color:var(--ink3);
  background:color-mix(in srgb,var(--surface) 78%,transparent); padding:2px 7px; border-radius:6px;
}

@media (max-width:820px){
  header{gap:12px; padding:11px 14px 9px}
  .stats{gap:16px; margin-left:0; width:100%; justify-content:space-between}
  .stat .v{font-size:15px}
  #panel{display:none}
  #panel.open{display:block; width:min(252px,calc(100vw - 28px))}
  #legend{width:186px; padding:10px 12px 9px}
  #searchwrap{left:58px}
}
@media (prefers-reduced-motion:reduce){ .z{transition:none} }
</style>

const fmtArea = a => a < 1 ? a.toFixed(2) : a < 10 ? a.toFixed(1) : fmt(a);
const tx = x => x - XMIN, ty = y => YMAX - y;

const classOf = z => {
  if (z.d <= 0) return 'kz';
  for (let i = 0; i < BREAKS.length; i++) if (z.d < BREAKS[i]) return 'k' + i;
  return 'k' + BREAKS.length;
};

// ---------- build zone paths ----------
const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
const zonesG = document.createElementNS(NS, 'g');
const byTaz = new Map();
for (const z of DATA.zones) {
  let d = '', x0 = 1e12, y0 = 1e12, x1 = -1e12, y1 = -1e12;
  for (const ring of z.g) {
    d += 'M';
    for (let i = 0; i < ring.length; i++) {
      const px = tx(ring[i][0]), py = ty(ring[i][1]);
      d += (i ? 'L' : '') + px + ' ' + py;
      if (px < x0) x0 = px; if (px > x1) x1 = px;
      if (py < y0) y0 = py; if (py > y1) y1 = py;
    }
    d += 'Z';
  }
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d);
  p.setAttribute('class', 'z ' + classOf(z));
  p.setAttribute('vector-effect', 'non-scaling-stroke');
  p.dataset.taz = z.t;
  zonesG.appendChild(p);
  byTaz.set(z.t, { z, p, bb: [x0, y0, x1, y1] });
}
svg.appendChild(zonesG);

// ---------- city labels ----------
const citiesG = document.createElementNS(NS, 'g');
const cityNodes = [];
for (const c of DATA.cities) {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'city');
  g.setAttribute('transform', `translate(${tx(c.x)} ${ty(c.y)})`);
  const dot = document.createElementNS(NS, 'circle');
  const t = document.createElementNS(NS, 'text');
  t.textContent = c.n;
  g.append(dot, t); citiesG.appendChild(g);
  cityNodes.push({ dot, t });
}
svg.appendChild(citiesG);

// ---------- viewBox pan / zoom ----------
const FIT = { x: -W * .03, y: -H * .02, w: W * 1.06, h: H * 1.04 };
let vb = { ...FIT };
function setVB(nx, ny, nw, nh) {
  const maxW = FIT.w * 1.6, minW = W / 80;
  nw = Math.max(minW, Math.min(maxW, nw));
  nh = nw * (vb.h / vb.w);
  vb = { x: nx, y: ny, w: nw, h: nh };
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const ctm = svg.getScreenCTM();
  const u = ctm ? 1 / ctm.a : 1;                    // svg units per screen px
  for (const { dot, t } of cityNodes) {
    dot.setAttribute('r', 2.6 * u);
    t.setAttribute('x', 5.5 * u);
    t.setAttribute('y', -5 * u);
    t.setAttribute('font-size', 12 * u);
  }
}
function zoomAt(f, cx, cy) {   // f>1 zooms in; (cx,cy) in svg coords
  const nw = vb.w / f;
  setVB(cx - (cx - vb.x) / f, cy - (cy - vb.y) / f, nw, vb.h / f);
}
const toSvgPt = (clientX, clientY) => {
  const m = svg.getScreenCTM(); if (!m) return { x: 0, y: 0 };
  return new DOMPoint(clientX, clientY).matrixTransform(m.inverse());
};
svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
requestAnimationFrame(() => setVB(vb.x, vb.y, vb.w, vb.h));
addEventListener('resize', () => setVB(vb.x, vb.y, vb.w, vb.h));

const stage = document.getElementById('stage');
stage.addEventListener('wheel', e => {
  if (e.target.closest('.card')) return;
  e.preventDefault();
  const pt = toSvgPt(e.clientX, e.clientY);
  zoomAt(Math.exp(-e.deltaY * .0016), pt.x, pt.y);
}, { passive: false });

const pointers = new Map();
let panning = false, moved = 0, pinchD = 0, downTaz = null;
svg.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  downTaz = (e.target.dataset && e.target.dataset.taz) ? +e.target.dataset.taz : null;
  svg.setPointerCapture(e.pointerId);
  if (pointers.size === 1) { panning = true; moved = 0; svg.classList.add('panning'); }
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchD = Math.hypot(a.x - b.x, a.y - b.y);
  }
});
svg.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId);
  if (!prev) { onHoverMove(e); return; }
  const cur = { x: e.clientX, y: e.clientY };
  if (pointers.size === 1 && panning) {
    const m = svg.getScreenCTM(), u = m ? 1 / m.a : 1;
    moved += Math.abs(cur.x - prev.x) + Math.abs(cur.y - prev.y);
    setVB(vb.x - (cur.x - prev.x) * u, vb.y - (cur.y - prev.y) * u, vb.w, vb.h);
  } else if (pointers.size === 2) {
    pointers.set(e.pointerId, cur);
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchD > 0 && d > 0) {
      const mid = toSvgPt((a.x + b.x) / 2, (a.y + b.y) / 2);
      zoomAt(d / pinchD, mid.x, mid.y);
    }
    pinchD = d;
  }
  pointers.set(e.pointerId, cur);
  onHoverMove(e);
});
const endPointer = e => {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) { panning = false; svg.classList.remove('panning'); }
};
svg.addEventListener('pointerup', e => {
  const wasTap = moved < 6 && pointers.size === 1;
  endPointer(e);
  if (wasTap) select(downTaz);
  downTaz = null;
});
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; });

document.getElementById('zin').onclick  = () => zoomAt(1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
document.getElementById('zout').onclick = () => zoomAt(1 / 1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
document.getElementById('zfit').onclick = () => { setVB(FIT.x, FIT.y, FIT.w, FIT.h); select(null); };

// ---------- tooltip ----------
const tip = document.getElementById('tip');
function onHoverMove(e) {
  if (panning && moved > 6) { tip.style.display = 'none'; return; }
  const taz = e.target && e.target.dataset && e.target.dataset.taz;
  if (!taz) { tip.style.display = 'none'; return; }
  const { z } = byTaz.get(+taz);
  const en = NAFA_EN[z.n] || '';
  tip.innerHTML =
    `<div class="t1"><b>TAZ ${z.t}</b><span>${en}${z.n ? ' · <bdi>' + z.n + '</bdi>' : ''}</span></div>` +
    (z.d > 0
      ? `<div class="t2">${fmt(z.d)} <small>people / km&sup2;</small></div>
         <div class="t3">${fmt(z.p)} people · ${fmtArea(z.a)} km&sup2;</div>`
      : `<div class="t2"><small>Uninhabited</small></div>
         <div class="t3">${fmtArea(z.a)} km&sup2;</div>`);
  const r = stage.getBoundingClientRect();
  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let lx = e.clientX - r.left + 14, ly = e.clientY - r.top + 14;
  if (lx + tw > r.width - 8)  lx = e.clientX - r.left - tw - 14;
  if (ly + th > r.height - 8) ly = e.clientY - r.top  - th - 14;
  tip.style.left = lx + 'px'; tip.style.top = ly + 'px';
}

// ---------- stats header ----------
const inhabited = DATA.zones.filter(z => z.d > 0).map(z => z.d).sort((a, b) => a - b);
const totPop = DATA.zones.reduce((s, z) => s + z.p, 0);
const totArea = DATA.zones.reduce((s, z) => s + z.a, 0);
const median = inhabited[Math.floor(inhabited.length / 2)];
document.getElementById('stats').innerHTML = [
  [fmt(totPop), 'people'],
  [fmt(totArea) + ' <small>km&sup2;</small>', 'land area'],
  [DATA.zones.length, 'TAZ zones'],
  [fmt(median) + ' <small>/km&sup2;</small>', 'median · inhabited zones'],
].map(([v, k]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');

// ---------- legend ----------
const counts = {};
for (const z of DATA.zones) { const k = classOf(z); counts[k] = (counts[k] || 0) + 1; }
const lrows = document.getElementById('lrows');
const legendDefs = [];
for (let i = BREAKS.length; i >= 0; i--) {
  const lo = i === 0 ? 1 : BREAKS[i - 1], hi = i === BREAKS.length ? null : BREAKS[i];
  legendDefs.push(['k' + i, hi ? `${fmt(lo)} – ${fmt(hi)}` : `${fmt(lo)}+`, `var(--r${i})`]);
}
legendDefs.push(['kz', 'Uninhabited', 'var(--rz)']);
for (const [k, label, sw] of legendDefs) {
  const b = document.createElement('button');
  b.className = 'lrow';
  b.innerHTML = `<span class="sw" style="background:${sw}"></span><span class="rng">${label}</span><span class="ct">${counts[k] || 0}</span>`;
  b.addEventListener('mouseenter', () => stage.dataset.hl = k);
  b.addEventListener('mouseleave', () => delete stage.dataset.hl);
  b.addEventListener('focus', () => stage.dataset.hl = k);
  b.addEventListener('blur', () => delete stage.dataset.hl);
  lrows.appendChild(b);
}

// ---------- detail panel ----------
const panel = document.getElementById('panel');
let selected = null;
const top10 = [...DATA.zones].sort((a, b) => b.d - a.d).slice(0, 10);

function renderTop() {
  panel.innerHTML = `<h2>Densest zones</h2>` + top10.map((z, i) =>
    `<button class="trow" data-taz="${z.t}">
       <span class="rk">${i + 1}</span><span class="tz">${z.t}</span>
       <span class="nf">${NAFA_EN[z.n] || '—'}</span>
       <span class="dv">${fmt(z.d)}</span>
     </button>`).join('') +
    `<div class="note">People per km&sup2;. Click a row — or any zone on the map — for details.</div>`;
  panel.querySelectorAll('.trow').forEach(b =>
    b.addEventListener('click', () => { select(+b.dataset.taz); zoomTo(+b.dataset.taz); }));
}

function renderZone(z) {
  const k = classOf(z);
  const idx = legendDefs.findIndex(d => d[0] === k);
  const chip = legendDefs[idx];
  const rank = inhabited.filter(d => d < z.d).length;
  const pct = inhabited.length > 1 ? Math.round(100 * rank / (inhabited.length - 1)) : 0;
  const en = NAFA_EN[z.n];
  panel.innerHTML =
    `<h2>Zone detail</h2>
     <div class="ztag"><span class="num">TAZ ${z.t}</span>
       <span class="chip"><span class="sw" style="background:${chip[2]}"></span>${chip[1]}</span></div>
     <div class="where">${en ? en + ' district · ' : ''}${z.n ? '<bdi>' + z.n + '</bdi> · ' : ''}superzone ${z.sz}</div>` +
    (z.d > 0
      ? `<div class="hero">${fmt(z.d)} <small>people / km&sup2;</small></div>
         <div class="pct">denser than ${pct}% of inhabited zones</div>`
      : `<div class="hero"><small style="font-size:19px">Uninhabited</small></div>
         <div class="pct">no resident population recorded</div>`) +
    `<div class="kv">
       <div><div class="v">${fmt(z.p)}</div><div class="k">population</div></div>
       <div><div class="v">${fmtArea(z.a)} km&sup2;</div><div class="k">area</div></div>
     </div>
     <button class="back">&larr; Back to densest zones</button>`;
  panel.querySelector('.back').addEventListener('click', () => select(null));
}

function select(taz) {
  if (selected) { const s = byTaz.get(selected); if (s) s.p.classList.remove('sel'); }
  selected = taz;
  if (taz && byTaz.has(taz)) {
    const s = byTaz.get(taz);
    s.p.classList.add('sel');
    zonesG.appendChild(s.p);          // raise selected stroke above neighbors
    renderZone(s.z);
    panel.classList.add('open');
  } else {
    selected = null;
    renderTop();
    panel.classList.remove('open');
  }
}
function zoomTo(taz) {
  const s = byTaz.get(taz); if (!s) return;
  const [x0, y0, x1, y1] = s.bb;
  const bw = Math.max(x1 - x0, 800), bh = Math.max(y1 - y0, 800);
  const pad = 2.4;
  const nw = Math.max(bw, bh * (vb.w / vb.h)) * pad;
  setVB((x0 + x1) / 2 - nw / 2, (y0 + y1) / 2 - (nw * vb.h / vb.w) / 2, nw, nw * vb.h / vb.w);
}
renderTop();

// ---------- search ----------
const search = document.getElementById('search'), swrap = document.getElementById('searchwrap');
search.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const taz = parseInt(search.value.trim(), 10);
  if (byTaz.has(taz)) { swrap.classList.remove('miss'); select(taz); zoomTo(taz); search.blur(); }
  else { swrap.classList.add('miss'); setTimeout(() => swrap.classList.remove('miss'), 900); }
});
addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });
})();
</script>
